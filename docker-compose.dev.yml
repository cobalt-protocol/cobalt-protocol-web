name: cobalt-protocol-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cobalt-protocol-web-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/.next
    command: bun run dev
