name: cobalt-protocol

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cobalt-protocol-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - HOSTNAME=0.0.0.0
    networks:
      - dokploy-network

networks:
  dokploy-network:
    name: dokploy-network
    external: true


